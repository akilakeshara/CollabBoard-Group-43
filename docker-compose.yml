version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: collabboard-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://collabboard.yourdomain.com:5001
        - VITE_SOCKET_URL=http://collabboard.yourdomain.com:5001
    container_name: collabboard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
